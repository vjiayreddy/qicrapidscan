name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: License notices
        run: pnpm check:licenses

      - name: Package + CDN + SSR smoke
        run: pnpm verify:packages && pnpm cdn:smoke && pnpm ssr:smoke

      - name: Pack verify
        run: pnpm pack:verify

      - name: Next.js playground production build
        run: pnpm playground:build
