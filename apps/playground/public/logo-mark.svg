<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="QicRapidScan">
  <defs>
    <clipPath id="round">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="64" height="64" fill="#ffffff"/>
    <!-- Quadrants -->
    <rect x="4" y="4" width="26" height="26" rx="3" fill="#F06020"/>
    <rect x="34" y="4" width="26" height="26" rx="3" fill="#285878"/>
    <rect x="4" y="34" width="26" height="26" rx="3" fill="#285878"/>
    <rect x="34" y="34" width="26" height="26" rx="3" fill="#F06020"/>
    <!-- Letters -->
    <text x="17" y="23" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Q</text>
    <text x="47" y="53" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">S</text>
    <!-- Soft curved X separator -->
    <path d="M30 2 C38 16 26 28 38 40 C44 48 36 56 36 62" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M34 2 C26 16 38 28 26 40 C20 48 28 56 28 62" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
